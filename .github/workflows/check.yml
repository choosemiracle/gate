name: VPN Gate Node Check

on:
  push:
    paths:
      - 'v2rayn/**'
      - '.github/workflows/check.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 16–32）'
        required: false
        default: '24'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '25'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
        run: |
          if [ -z "${DOMAIN}" ]; then
            echo "::error::请设置 Actions Secret DOMAIN（Worker 域名，仅 host，不含 https://）"
            exit 1
          fi
          if [ -z "${CHECK_TOKEN}" ]; then
            echo "::error::请设置 Actions Secret CHECK_TOKEN（与 Cloudflare Worker 的 CHECK_TOKEN 完全一致）"
            exit 1
          fi
          echo "检测 Worker 域名已配置，认证密钥已配置"

      - name: Run pipeline
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
          HOSTS_ENTRY: "104.17.99.242:443,104.17.212.202:443"
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '24' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '25' }}
          MAX_CHECK_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          MIN_SUCCESS_RATIO: '0'
        run: python vpngate.py

      - name: Test v2rayN subscription generator and candidate IP checker
        run: |
          python -m unittest discover -s v2rayn -p 'test_*.py' -v
          node --test v2rayn/test_subscription-worker.mjs

      - name: Verify Cloudflare IP candidates for v2rayN
        run: |
          python v2rayn/check_ips.py \
            --host alpha-beta-gamma.innerlightmessage.dpdns.org \
            --candidates v2rayn/candidates.txt \
            --output public/v2rayn-ips.json \
            --max-ips 10

      - name: Cloudflare V2 authenticated Xray probe (private secret, no credential logs)
        env:
          VLESS_PROBE_URI: ${{ secrets.VLESS_PROBE_URI }}
        run: |
          if [ -z "$VLESS_PROBE_URI" ]; then
            echo "::notice::VLESS_PROBE_URI not set; preserving V1 subscription until V2 is activated."
            exit 0
          fi
          set -euo pipefail
          mkdir -p /tmp/choosemiracle-xray
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip \
            --output /tmp/choosemiracle-xray/xray.zip
          echo 'e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  /tmp/choosemiracle-xray/xray.zip' | sha256sum --check
          unzip -qo /tmp/choosemiracle-xray/xray.zip xray -d /tmp/choosemiracle-xray
          chmod 755 /tmp/choosemiracle-xray/xray
          python v2rayn/v2_scan.py \
            --xray /tmp/choosemiracle-xray/xray \
            --candidates 200 --shortlist 55 \
            --output public/v2rayn-ips-v2.json

      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "${api}")
          echo "GET Pages -> ${status}"
          if [ "${status}" = "200" ]; then
            echo "GitHub Pages 已启用"
            exit 0
          fi
          if [ "${status}" = "404" ]; then
            create=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' -X POST \
              "${auth[@]}" -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "${api}")
            echo "POST Pages -> ${create}"
            case "${create}" in
              201|204|409) sleep 10; exit 0 ;;
              *)
                echo "::error::自动启用 Pages 失败。请在 Settings → Pages 将 Source 设为 GitHub Actions。"
                cat /tmp/pages-create.json 2>/dev/null || true
                exit 1
                ;;
            esac
          fi
          echo "::error::查询 Pages 状态失败（HTTP ${status}）"
          cat /tmp/pages.json 2>/dev/null || true
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "节点列表：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          echo "仪表盘：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
